<VirtualHost *:80>
    ServerName orcamentos.panificadoradreon.com.br

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    <Location "/">
        AuthType Basic
        AuthName "Orcamentos Dreon"
        AuthUserFile /etc/apache2/.htpasswd-orcamentos-dreon
        Require valid-user
    </Location>

    <Location "/.well-known/acme-challenge/">
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/orcamentos-dreon-error.log
    CustomLog ${APACHE_LOG_DIR}/orcamentos-dreon-access.log combined
</VirtualHost>
